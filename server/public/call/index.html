<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080812" />
    <title>Lunara · Videollamada</title>
    <link rel="stylesheet" href="/call/call.css" />
  </head>
  <body>
    <main id="stage">
      <video id="remote" autoplay playsinline></video>

      <!-- Écran d'attente / état de la connexion -->
      <section id="overlay">
        <div class="moon" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="96" height="96">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#F6DDB0" />
                <stop offset="0.55" stop-color="#D4A76A" />
                <stop offset="1" stop-color="#A97C45" />
              </linearGradient>
              <mask id="m">
                <rect width="100" height="100" fill="white" />
                <circle cx="61" cy="45" r="31" fill="black" />
              </mask>
            </defs>
            <circle cx="45" cy="55" r="38" fill="url(#g)" mask="url(#m)" />
            <path d="M63 35 L66 49 L80 52 L66 55 L63 69 L60 55 L46 52 L60 49 Z" fill="url(#g)" />
          </svg>
        </div>
        <p id="peer-name"></p>
        <p id="status"></p>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </section>

      <header id="topbar">
        <div class="pill" id="peer-pill"><span class="live"></span><span id="peer-label"></span></div>
        <div class="pill" id="timer">--:--</div>
      </header>

      <div id="peer-muted" class="pill hidden"></div>

      <video id="local" autoplay playsinline muted></video>

      <nav id="controls">
        <button id="mic" class="ctl" aria-label="micro">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" /></svg>
        </button>
        <button id="cam" class="ctl" aria-label="caméra">
          <svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10m1-2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4V7a1 1 0 0 0-1-1Z" /></svg>
        </button>
        <button id="flip" class="ctl" aria-label="retourner">
          <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-5 11.5V14H9v2.5L5.5 13 9 9.5V12h6V9.5l3.5 3.5-3.5 3.5Z" /></svg>
        </button>
        <button id="hangup" class="ctl danger" aria-label="raccrocher">
          <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a.98.98 0 0 1-1.38-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.51 2.47a.98.98 0 0 1-1.38.02 11.27 11.27 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9Z" /></svg>
        </button>
      </nav>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/call/call.js"></script>
  </body>
</html>
